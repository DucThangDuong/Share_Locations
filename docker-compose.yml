services:
  # 1. RabbitMQ Message Broker (Management Web UI on port 15672)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: travel_review_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - travel_network

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: travel_review_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - travel_network

  # 3. .NET 8 Backend Web API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: travel_review_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - "ConnectionStrings__SqlServer=${SQLSERVER_CONNECTION_STRING:-Server=host.docker.internal,1433;Database=TravelReviewDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ChangeThisPassword123!};TrustServerCertificate=${MSSQL_TRUST_SERVER_CERTIFICATE:-True};Encrypt=${MSSQL_ENCRYPT:-False};}"
      - ConnectionStrings__Redis=redis:6379
      - "ConnectionStrings__AzureStorageAccount=${AZURE_STORAGE_CONNECTION_STRING:-}"
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - "Jwt__SecretKey=${JWT_SECRET_KEY:?CRITICAL: JWT_SECRET_KEY must be configured in .env}"
      - "Jwt__Issuer=${JWT_ISSUER:-TravelReviewBackend}"
      - "Jwt__Audience=${JWT_AUDIENCE:-TravelReviewClient}"
      - Jwt__ExpireMinutes=${JWT_EXPIRE_MINUTES:-1440}
      - "Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}"
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://localhost:5177
      - Cors__AllowedOrigins__2=http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - travel_network

  # 4. React + Vite Frontend
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
        - VITE_MAPBOX_ACCESS_TOKEN=${VITE_MAPBOX_ACCESS_TOKEN:-}
    container_name: travel_review_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
      - VITE_MAPBOX_ACCESS_TOKEN=${VITE_MAPBOX_ACCESS_TOKEN:-}
    depends_on:
      - backend
    networks:
      - travel_network

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  travel_network:
    driver: bridge
