services:
  # 1. SQL Server 2022 Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: travel_review_sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-ChangeThisPassword123!}
      - MSSQL_PID=Developer
    ports:
      - "${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-ChangeThisPassword123!}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - travel_network

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: travel_review_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-63799}:6379"
    volumes:
      - redis_data:/data
    networks:
      - travel_network

  # 3. .NET 8 Backend Web API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: travel_review_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=TravelReviewDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ChangeThisPassword123!};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - Jwt__SecretKey=${JWT_SECRET_KEY:?CRITICAL: JWT_SECRET_KEY must be configured in .env}
      - Jwt__Issuer=${JWT_ISSUER:-TravelReviewBackend}
      - Jwt__Audience=${JWT_AUDIENCE:-TravelReviewClient}
      - Jwt__ExpireMinutes=${JWT_EXPIRE_MINUTES:-1440}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - travel_network

  # 4. React + Vite Frontend (Chạy trực tiếp Vite dev server với Hot Reload)
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: travel_review_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-223812972896-benbnh6naphnp32srn471kru8dbldf93.apps.googleusercontent.com}
    depends_on:
      - backend
    networks:
      - travel_network

volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local

networks:
  travel_network:
    driver: bridge
